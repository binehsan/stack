{% comment %}
Shared shell for every transactional email — email clients strip <style>
blocks unpredictably, so every rule here is inlined rather than in a
stylesheet. Colors are the website's "Classic" theme tokens (see
website/src/index.css) hardcoded, since an email has no CSS variables and
no access to whichever theme the recipient actually has picked.
{% endcomment %}
<!DOCTYPE html>
<html>
  <body style="margin:0; padding:0; background:#F5EFE6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F5EFE6; padding: 32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 420px; background:#FFFFFF; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,0.06);">
            <tr>
              <td style="background: linear-gradient(135deg, #FFEB97, #E7B768); padding: 28px 32px; text-align:center;">
                <img src="{{ frontend_url }}/logo-mark.png" width="40" height="40" alt="Stack" style="display:block; margin: 0 auto 8px; border-radius: 10px;" />
                <span style="font-size: 20px; font-weight: 700; color: #583714;">Stack</span>
              </td>
            </tr>
            <tr>
              <td style="padding: 32px;">
                {% block content %}{% endblock %}
              </td>
            </tr>
            <tr>
              <td style="padding: 20px 32px; border-top: 1px solid #EFE7DA; text-align:center;">
                <span style="font-size: 12px; color: #9C8F7C;">Stack &mdash; your tasks, together.</span>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
