# Stack's server block, added alongside whatever nginx already serves (the
# college library app) — not a replacement config. Copy this file to
# /etc/nginx/conf.d/stack.conf on the VPS (Rocky's nginx package auto-
# includes everything in that directory), then run:
#   sudo certbot --nginx -d stack.hellosyntax.dev
# certbot rewrites this file in place to add the HTTPS server block + an
# HTTP->HTTPS redirect — don't hand-add SSL directives yourself first.
#
# Paths below assume the repo lives at /srv/stack (see the deploy guide) —
# update them if it's cloned somewhere else.

server {
    listen 80;
    server_name stack.hellosyntax.dev;

    client_max_body_size 10M;

    # Django, via gunicorn inside the `backend` container — bound to
    # 127.0.0.1:8001 only (see docker-compose.yml), reachable from nowhere
    # but this box.
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Avatars/group photos and Django's collected admin static, written by
    # the backend container onto the host via docker-compose.yml's bind
    # mounts (./media, ./staticfiles under /srv/stack) — served directly by
    # nginx, never proxied through gunicorn.
    location /media/ {
        alias /srv/stack/media/;
    }

    location /static/ {
        alias /srv/stack/staticfiles/;
    }

    # The PWA itself — a static build (`cd PWA && npm run build`), served as
    # an SPA: any path nginx can't find as a real file falls back to
    # index.html so client-side routes (e.g. /dashboard) don't 404 on a
    # direct load or a refresh.
    location / {
        root /srv/stack/PWA/dist;
        try_files $uri $uri/ /index.html;
    }

    # The service worker and manifest must never be cached long — a stale
    # cached sw.js means installed clients never see updates. Everything
    # else under /assets/ is safe to cache hard since Vite fingerprints
    # those filenames on every build.
    location = /sw.js {
        root /srv/stack/PWA/dist;
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        root /srv/stack/PWA/dist;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        root /srv/stack/PWA/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
